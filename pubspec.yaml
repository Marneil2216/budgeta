name: budgeta
description: A smart budget tracking app for managing your monthly salary.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.5.0
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  go_router: ^14.2.7
  intl: ^0.19.0
  flutter_animate: ^4.5.0
  shared_preferences: ^2.3.0
  image_picker: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  custom_lint: ^0.6.7
  riverpod_lint: ^2.3.10
  flutter_lints: ^4.0.0

dependency_overrides:
  app_links: ^7.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
